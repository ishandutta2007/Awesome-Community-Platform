<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="glow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(10px) scale(1.04); }
      }
      @keyframes pulseNode {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.35); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes waveGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.65; }
      }
      .floating-group { animation: floatSlow 7s ease-in-out infinite; }
      .floating-reverse { animation: floatReverse 6s ease-in-out infinite; }
      .node-pulse-1 { animation: pulseNode 3.5s ease-in-out infinite; transform-origin: center; }
      .node-pulse-2 { animation: pulseNode 4.2s ease-in-out infinite 1s; transform-origin: center; }
      .node-pulse-3 { animation: pulseNode 3.8s ease-in-out infinite 2s; transform-origin: center; }
      .line-dash { stroke-dasharray: 6, 8; animation: dashMove 12s linear infinite; }
      .bg-wave { animation: waveGlow 5s ease-in-out infinite; }
      .badge-chip { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: 0.5px; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-weight: 900; letter-spacing: -0.5px; }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bgGrad)" rx="16" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="750" y1="0" x2="750" y2="380" />
    <line x1="900" y1="0" x2="900" y2="380" />
    <line x1="1050" y1="0" x2="1050" y2="380" />
  </g>

  <!-- Dynamic Glowing Orbs -->
  <circle cx="220" cy="110" r="170" fill="url(#glow1)" filter="url(#blurFilter)" class="bg-wave" />
  <circle cx="980" cy="270" r="210" fill="url(#glow2)" filter="url(#blurFilter)" class="bg-wave" />

  <!-- Dynamic Constellation Network (Left & Right) -->
  <g class="floating-group" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="80" y1="120" x2="160" y2="70" class="line-dash" />
    <line x1="160" y1="70" x2="230" y2="150" class="line-dash" />
    <line x1="80" y1="120" x2="110" y2="230" class="line-dash" />
    <line x1="110" y1="230" x2="230" y2="150" class="line-dash" />
    <line x1="230" y1="150" x2="280" y2="270" class="line-dash" />
    <line x1="110" y1="230" x2="200" y2="310" class="line-dash" />

    <!-- Nodes with Pulse -->
    <circle cx="80" cy="120" r="6" fill="#38bdf8" filter="url(#nodeGlow)" class="node-pulse-1" />
    <circle cx="160" cy="70" r="4" fill="#818cf8" class="node-pulse-2" />
    <circle cx="230" cy="150" r="8" fill="#c084fc" filter="url(#nodeGlow)" class="node-pulse-3" />
    <circle cx="110" cy="230" r="5" fill="#38bdf8" class="node-pulse-1" />
    <circle cx="280" cy="270" r="6" fill="#818cf8" class="node-pulse-2" />
    <circle cx="200" cy="310" r="4" fill="#a855f7" class="node-pulse-3" />
  </g>

  <g class="floating-reverse" stroke="#c084fc" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="970" y1="90" x2="1080" y2="140" class="line-dash" />
    <line x1="1080" y1="140" x2="1130" y2="260" class="line-dash" />
    <line x1="970" y1="90" x2="940" y2="210" class="line-dash" />
    <line x1="940" y1="210" x2="1040" y2="290" class="line-dash" />
    <line x1="1040" y1="290" x2="1130" y2="260" class="line-dash" />

    <circle cx="970" cy="90" r="6" fill="#c084fc" filter="url(#nodeGlow)" class="node-pulse-2" />
    <circle cx="1080" cy="140" r="7" fill="#818cf8" filter="url(#nodeGlow)" class="node-pulse-1" />
    <circle cx="1130" cy="260" r="5" fill="#38bdf8" class="node-pulse-3" />
    <circle cx="940" cy="210" r="8" fill="#ec4899" filter="url(#nodeGlow)" class="node-pulse-1" />
    <circle cx="1040" cy="290" r="5" fill="#a855f7" class="node-pulse-2" />
  </g>

  <!-- Central Content Box -->
  <g transform="translate(600, 190)" text-anchor="middle">
    <!-- Top Pill Badge -->
    <g transform="translate(0, -115)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="-116" cy="0" r="4.5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="8" y="4.5" fill="#e2e8f0" class="badge-chip" font-size="12">🚀 CURATED PLATFORM ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="-20" fill="url(#titleGrad)" class="title-text" font-size="46" filter="drop-shadow(0 4px 12px rgba(56, 189, 248, 0.25))">
      Awesome Community Platform
    </text>

    <!-- Subtitle -->
    <text x="0" y="22" fill="#94a3b8" class="subtitle-text" font-size="16.5" letter-spacing="0.2">
      Curated List of SaaS Products &amp; Open-Source Projects for Community &amp; Forum Building
    </text>

    <!-- Feature Tag Chips -->
    <g transform="translate(0, 72)">
      <!-- Chip 1 -->
      <g transform="translate(-320, 0)">
        <rect x="-55" y="-14" width="110" height="28" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="0" y="4.5" fill="#38bdf8" class="badge-chip" font-size="11.5">💬 Discussion</text>
      </g>
      <!-- Chip 2 -->
      <g transform="translate(-190, 0)">
        <rect x="-55" y="-14" width="110" height="28" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="0" y="4.5" fill="#818cf8" class="badge-chip" font-size="11.5">🌐 Fediverse</text>
      </g>
      <!-- Chip 3 -->
      <g transform="translate(-60, 0)">
        <rect x="-55" y="-14" width="110" height="28" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="0" y="4.5" fill="#c084fc" class="badge-chip" font-size="11.5">📱 Real-Time</text>
      </g>
      <!-- Chip 4 -->
      <g transform="translate(70, 0)">
        <rect x="-55" y="-14" width="110" height="28" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="0" y="4.5" fill="#ec4899" class="badge-chip" font-size="11.5">📚 Knowledge</text>
      </g>
      <!-- Chip 5 -->
      <g transform="translate(200, 0)">
        <rect x="-55" y="-14" width="110" height="28" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="0" y="4.5" fill="#34d399" class="badge-chip" font-size="11.5">📊 Analytics</text>
      </g>
      <!-- Chip 6 -->
      <g transform="translate(330, 0)">
        <rect x="-55" y="-14" width="110" height="28" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="0" y="4.5" fill="#facc15" class="badge-chip" font-size="11.5">🛡️ Moderation</text>
      </g>
    </g>
  </g>

  <!-- Border Accent -->
  <rect x="0.5" y="0.5" width="1199" height="379" rx="16" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
</svg>
